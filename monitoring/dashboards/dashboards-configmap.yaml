apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  prometheus-dashboard.json: |
    {
      "title": "My Prometheus Dashboard",
      "uid": "my-prometheus-dashboard",
      "schemaVersion": 39,
      "description": "Node-level metrics (CPU, load, memory, disk, network) and Kubernetes cluster metrics (resource usage, pod status, node health, namespace consumption).",
      "version": 1,
      "panels": [
        {
          "id": 1,
          "title": "CPU Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": { "unit": "percent", "min": 0, "max": 100 }
          },
          "targets": [
            {
              "expr": "100 - (avg by(instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "legendFormat": "{{instance}}",
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" }
            }
          ]
        },
        {
          "id": 2,
          "title": "Load Average",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "node_load1{instance=~\"$instance\"}",
              "legendFormat": "{{instance}} - 1m",
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" }
            },
            {
              "expr": "node_load5{instance=~\"$instance\"}",
              "legendFormat": "{{instance}} - 5m",
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" }
            },
            {
              "expr": "node_load15{instance=~\"$instance\"}",
              "legendFormat": "{{instance}} - 15m",
              "refId": "C",
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" }
            }
          ]
        },
        {
          "id": 3,
          "title": "Memory Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": {
            "defaults": { "unit": "bytes" }
          },
          "targets": [
            {
              "expr": "node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes",
              "legendFormat": "{{instance}} - Used",
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" }
            },
            {
              "expr": "node_memory_MemAvailable_bytes",
              "legendFormat": "{{instance}} - Available",
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" }
            },
            {
              "expr": "node_memory_MemTotal_bytes",
              "legendFormat": "{{instance}} - Total",
              "refId": "C",
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" }
            }
          ]
        },
        {
          "id": 4,
          "title": "Disk I/O",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": {
            "defaults": { "unit": "Bps" }
          },
          "targets": [
            {
              "expr": "rate(node_disk_read_bytes_total[5m])",
              "legendFormat": "{{instance}} - {{device}} read",
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" }
            },
            {
              "expr": "rate(node_disk_written_bytes_total[5m])",
              "legendFormat": "{{instance}} - {{device}} write",
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" }
            }
          ]
        },
        {
          "id": 5,
          "title": "Disk Space Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "fieldConfig": {
            "defaults": { "unit": "percent", "min": 0, "max": 100 }
          },
          "targets": [
            {
              "expr": "100 - ((node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay\"} * 100) / node_filesystem_size_bytes{fstype!~\"tmpfs|overlay\"})",
              "legendFormat": "{{instance}} - {{mountpoint}}",
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" }
            }
          ]
        },
        {
          "id": 6,
          "title": "Network Traffic (In/Out)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "fieldConfig": {
            "defaults": { "unit": "Bps" }
          },
          "targets": [
            {
              "expr": "rate(node_network_receive_bytes_total{device!~\"lo\"}[5m])",
              "legendFormat": "{{instance}} - {{device}} in",
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" }
            },
            {
              "expr": "rate(node_network_transmit_bytes_total{device!~\"lo\"}[5m])",
              "legendFormat": "{{instance}} - {{device}} out",
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" }
            }
          ]
        },
        {
          "id": 7,
          "title": "Cluster CPU: Requests vs Limits vs Actual Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "fieldConfig": {
            "defaults": { "unit": "short" }
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"\", namespace=~\"$namespace\"}[5m]))",
              "legendFormat": "actual usage (cores)",
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" }
            },
            {
              "expr": "sum(kube_pod_container_resource_requests{resource=\"cpu\", namespace=~\"$namespace\"})",
              "legendFormat": "requests (cores)",
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" }
            },
            {
              "expr": "sum(kube_pod_container_resource_limits{resource=\"cpu\", namespace=~\"$namespace\"})",
              "legendFormat": "limits (cores)",
              "refId": "C",
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" }
            }
          ]
        },
        {
          "id": 8,
          "title": "Cluster Memory: Requests vs Limits vs Actual Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "fieldConfig": {
            "defaults": { "unit": "bytes" }
          },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{container!=\"\", namespace=~\"$namespace\"})",
              "legendFormat": "actual usage",
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" }
            },
            {
              "expr": "sum(kube_pod_container_resource_requests{resource=\"memory\", namespace=~\"$namespace\"})",
              "legendFormat": "requests",
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" }
            },
            {
              "expr": "sum(kube_pod_container_resource_limits{resource=\"memory\", namespace=~\"$namespace\"})",
              "legendFormat": "limits",
              "refId": "C",
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" }
            }
          ]
        },
        {
          "id": 9,
          "title": "Pod Status",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 32 },
          "targets": [
            {
              "expr": "sum by (phase) (kube_pod_status_phase{namespace=~\"$namespace\"})",
              "legendFormat": "{{phase}}",
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" }
            }
          ]
        },
        {
          "id": 10,
          "title": "Pod Restarts",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 32 },
          "targets": [
            {
              "expr": "sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[15m]))",
              "legendFormat": "{{namespace}}/{{pod}}",
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" }
            }
          ]
        },
        {
          "id": 11,
          "title": "Node Health (Ready Status)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 40 },
          "targets": [
            {
              "expr": "kube_node_status_condition{condition=\"Ready\", status=\"true\"}",
              "legendFormat": "{{node}}",
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" }
            }
          ]
        },
        {
          "id": 12,
          "title": "Node Capacity (CPU & Memory)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 40 },
          "targets": [
            {
              "expr": "sum by (node) (kube_node_status_capacity{resource=\"cpu\"})",
              "legendFormat": "{{node}} - CPU cores",
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" }
            },
            {
              "expr": "sum by (node) (kube_node_status_capacity{resource=\"memory\"})",
              "legendFormat": "{{node}} - Memory bytes",
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" }
            }
          ]
        },
        {
          "id": 13,
          "title": "Namespace-Level Resource Consumption (CPU)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 48 },
          "targets": [
            {
              "expr": "sum by (namespace) (rate(container_cpu_usage_seconds_total{container!=\"\"}[5m]))",
              "legendFormat": "{{namespace}}",
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" }
            }
          ]
        },
        {
          "id": 14,
          "title": "Namespace-Level Resource Consumption (Memory)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 48 },
          "fieldConfig": {
            "defaults": { "unit": "bytes" }
          },
          "targets": [
            {
              "expr": "sum by (namespace) (container_memory_working_set_bytes{container!=\"\"})",
              "legendFormat": "{{namespace}}",
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" }
            }
          ]
        }
      ],
      "templating": {
        "list": [
          {
            "name": "instance",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
            "query": "label_values(node_uname_info, instance)",
            "multi": true,
            "includeAll": true,
            "current": { "text": "All", "value": "$__all" }
          },
          {
            "name": "namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
            "query": "label_values(kube_namespace_status_phase, namespace)",
            "multi": true,
            "includeAll": true,
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "time": { "from": "now-6h", "to": "now" },
      "refresh": "30s"
    }