apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  prometheus-dashboard.json: |
    {
      "title": "My Prometheus Dashboard",
      "uid": "my-prometheus-dashboard",
      "schemaVersion": 39,
      "version": 1,
      "panels": [
        {
          "id": 1,
          "title": "CPU Usage",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "100 - (avg by(instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "refId": "A"
            }
          ]
        }
      ]
    }