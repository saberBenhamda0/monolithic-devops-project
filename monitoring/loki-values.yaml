loki:
  enabled: true
  isDefault: false
  url: http://{{(include "loki.serviceName" .)}}:{{ .Values.loki.service.port }}
  readinessProbe:
    httpGet:
      path: /ready
      port: http-metrics
    initialDelaySeconds: 45
  livenessProbe:
    httpGet:
      path: /ready
      port: http-metrics
    initialDelaySeconds: 45
  datasource:
    jsonData: "{}"
    uid: ""
  limits_config:
    retention_period: 168h  # each 7 days run the command to delete old logs (this alone will not delete logs)
  compactor:
    retention_enabled: true # enfore deleting logs

promtail:
  enabled: true
  config:
    logLevel: info
    serverPort: 3101
    clients:
      - url: http://{{ .Release.Name }}:3100/loki/api/v1/push

grafana:
  enabled: true
  service:
    type: ClusterIP
    port: 3000
  sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        folder: /tmp/dashboards
        searchNamespace: monitoring
      datasources:
        enabled: true
        label: grafana_datasource
        labelValue: "1"
        searchNamespace: monitoring
        # folder is fixed internally to /etc/grafana/provisioning/datasources — not configurable via `folder:` key
  image:
    tag: latest
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: standard