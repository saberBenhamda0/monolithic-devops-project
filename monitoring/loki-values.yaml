loki:
  enabled: true

  readinessProbe:
    httpGet:
      path: /ready
      port: http-metrics
    initialDelaySeconds: 45

  livenessProbe:
    httpGet:
      path: /ready
      port: http-metrics
    initialDelaySeconds: 45

  limits_config:
    retention_period: 168h

  compactor:
    retention_enabled: true
    
promtail:
  enabled: true
  config:
    logLevel: info
    serverPort: 3101
    clients:
      - url: http://{{ .Release.Name }}:3100/loki/api/v1/push

grafana:
  enabled: true
  service:
    type: ClusterIP
    port: 3000
  admin:
    existingSecret: "grafana-admin-credentials"
    userKey: admin-user
    passwordKey: admin-password
  sidecar:
      dashboards:
        resource: configmap
        watchMethod: WATCH
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        folder: /tmp/dashboards
        searchNamespace: ALL
      datasources:
        enabled: true
        label: grafana_datasource
        labelValue: "1"
        searchNamespace: ALL
        resource: configmap
        watchMethod: WATCH
        folder: /etc/grafana/provisioning/datasources
        # folder is fixed internally to /etc/grafana/provisioning/datasources — not configurable via `folder:` key
  image:
    tag: latest
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: standard