apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-stack
  namespace: argocd
spec:
  project: default
  sources:
    # 1️⃣ Helm chart
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki-stack
      targetRevision: 2.10.3
      helm:
        valueFiles:
          - $values/monitoring/loki-values.yaml  # 👈 Fixed: Must use $values prefix + full path

    # 2️⃣ Values repo
    - repoURL: https://github.com/saberBenhamda0/monolithic-devops-project
      targetRevision: main
      ref: values  # 👈 This creates the $values reference
      path: .      # 👈 Changed to root since we specify full path above

    # 3️⃣ Dashboards ConfigMaps (plain manifests)
    - repoURL: https://github.com/saberBenhamda0/monolithic-devops-project
      targetRevision: main
      path: monitoring/dashboards   # 👈 folder containing your ConfigMap YAML files


    # 3️⃣ Dashboards ConfigMaps (plain manifests)
    - repoURL: https://github.com/saberBenhamda0/monolithic-devops-project
      targetRevision: main
      path: monitoring/datasources   # 👈 folder containing your ConfigMap YAML files

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true